<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-4</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    li {
        list-style: none;
    }
    a {
        text-decoration: none;
        color: #000;
    }
    #wrap {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    #aside {
        width: 200px;
    }
    #aside .logo{
        width: 100%;
        height: 100px;
        background-color: #aba8a8;
    }
    #aside .nav {
        width: 100%;
        height: 700px;
        background-color: #c6c4c4;
    }

    #main {
        width: calc(100% - 200px);
    }
    #main .content{
        display: flex;
    }
    #main .slide {
        width: 80%;
        height: 500px;
        background-color: #e6e1e1;
    }
    #main .banner {
        width: 20%;
        height: 500px;
        background-color: #cdcccc;
    }
    #main .noti {
        width: 100%;
        height: 300px;
        background-color: #c9baba;
    }

    #footer {
        width: 100%;
        display: flex;
    }
    #footer .logo {
        background-color: #a98989;
        width: 20%;
        height: 100px;
    }
    #footer .copyRight {
        background-color: #7f6b6b;
        width: 60%;
        height: 100px;
    }
    #footer .site {
        background-color: #352727;
        width: 20%;
        height: 100px;
    }

    /* nav */
    .nav > ul > li > a {
        display: block;
        padding: 10px 50px;
        text-align: center;
        background-color: #767676;
    }
    .nav > ul > li > a:hover{
        background-color: #939090;
    }
    .nav > ul > li > ul {
        display: none;
    }
    .nav > ul > li > ul > li > a {
        display: block;
        padding: 10px;
        text-align: center;
    }
    .nav > ul > li > ul > li > a:hover {
        background-color: #fad7d7;
    }
    /* 자바스크립트용 css */
    .nav > ul > li > ul {
        display: block;
        height: 0;
        overflow: hidden;
        transition: all 800ms;
    }
</style>
<body>
    <div id="wrap">
        <div id="aside">
            <h1 class="logo"></h1>
            <nav class="nav">
                <ul>
                    <li>
                        <a href="#">메뉴1</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴1-1</a></li>
                            <li><a href="#">서브메뉴1-2</a></li>
                            <li><a href="#">서브메뉴1-3</a></li>
                            <li><a href="#">서브메뉴1-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴2</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴2-1</a></li>
                            <li><a href="#">서브메뉴2-2</a></li>
                            <li><a href="#">서브메뉴2-3</a></li>
                            <li><a href="#">서브메뉴2-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴3</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴3-1</a></li>
                            <li><a href="#">서브메뉴3-2</a></li>
                            <li><a href="#">서브메뉴3-3</a></li>
                            <li><a href="#">서브메뉴3-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴4</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴4-1</a></li>
                            <li><a href="#">서브메뉴4-2</a></li>
                            <li><a href="#">서브메뉴4-3</a></li>
                            <li><a href="#">서브메뉴4-4</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </div>
        <div id="main">
            <div class="content">
                <section class="slide"></section>
                <section class="banner"></section>
            </div>
            <section class="noti"></section>
        </div>
        <div id="footer">
            <h1 class="logo"></h1>
            <div class="copyRight"></div>
            <div class="site"></div>
        </div>
    </div>
</body>
<script>
    window.onload = function() {
        let navList = document.querySelectorAll(".nav > ul > li");
        navList.forEach(navItem => {
            navItem.addEventListener("mouseover", function() {
                this.querySelector(".submenu").style.height = "155px";
            })
        })
        /* this를 사용하려면 화살표함수를 사용하면 안된다. */
        navList.forEach(navItem => {
            navItem.addEventListener("mouseout", function() {
                this.querySelector(".submenu").style.height = "0";
            })
        })
    }
</script>
</html>
