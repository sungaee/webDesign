<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        li{
            list-style: none;
        }
        a{
            text-decoration: none;
            color: #000;
        }
        #wrap {
            width: 100%;
        }
        #main {
            width: 100%;
            display: flex;
            height: calc(100vh - 120px); /* footer 높이 제외 */
        }
        #header{
            width: 200px;
            height: 100%;
        }
        #header .logo{
            width: 100%;
            height: 10%;
            background-color: #e2e2e2;
        }
        #header .menu{
            width: 100%;
            height: 90%;
            background-color: #d1d1d1;
        }
        #contents{
            width: 400px;
            height: 100%;;
        }
        #contents .banner{
            width: 100%;
            height: 15%;
            background-color: #c2c2c2;
        }
        #contents .notice{
            width: 100%;
            height: 35%;
            background-color: #acacac;
        }
        #contents .gallery{
            width: 100%;
            height: 35%;
            background-color: #959595;
        }
        #contents .link{
            width: 100%;
            height: 15%;
            background-color: #838282;
        }
        #slider{
            width: calc(100% - 600px);
            height: 100%;
            background-color: #b8a2a2;
        }
        #footer{
            width: 100%;
            display: flex;
        }
        #footer .footer1{
            width: 20%;
            height: 120px;
            background-color: #fadada;
        }
        #footer .footer2{
            width: 80%;
        }
        #footer .footer2 .footer2-1{
            width: 100%;
            height: 60px;
            background-color: #ffdddd;
        }
        #footer .footer2 .footer2-2{
            width: 100%;
            height: 60px;
            background-color: #fff0f0;

        }
        /* slider */
        .sliderWrap{
            position: relative;
            height: 100%;
        }
        /* .sliderWrap > div{
            display: none;
        }
        .sliderWrap > div:first-child{
            display: block;
        } */
        .sliderWrap .slider{
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            background-size: cover;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .sliderWrap .slider.s1{
            background-image: url(/image/slider3.jpg);
        }
        .sliderWrap .slider.s2{
            background-image: url(/image/slider2.jpg);
        }
        .sliderWrap .slider.s3{
            background-image: url(/image/slider4.jpg);
        }
        .sliderWrap .slider span{
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background-color: #ffffff98;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <main id="main">
            <header id="header">
                <h1 class="logo"></h1>
                <nav class="menu"></nav>
            </header>
            <!-- header -->

            <section id="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="link"></div>
            </section>
            <!-- contents -->

            <article id="slider">
                <div class="sliderWrap">
                    <div class="slider s1">
                        <span>이미지1</span>
                    </div>
                    <div class="slider s2">
                        <span>이미지2</span>
                    </div>
                    <div class="slider s3">
                        <span>이미지3</span>
                    </div>
                </div>
            </article>
            <!-- slider -->
        </main>
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </footer>
        <!-- footer -->
    </div>


    <script>
        window.onload = function(){

            let currentIndex = 0;
            const slider = document.querySelectorAll(".slider");
            slider.forEach(el => {
                el.style.opacity = "0";
            })
            slider[0].style.opacity = "1";

            setInterval(() => {
                let nextIndex = (currentIndex + 1) % slider.length;
                slider[currentIndex].style.opacity = "0";
                slider[nextIndex].style.opacity = "1";
                slider.forEach(el => el.style.transition = "all 1s")

                currentIndex= nextIndex
            },3000)
        }
    </script>
</body>
</html>
