<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-1</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    }
    a {
        text-decoration: none;
        color: #000;
    }
    #wrap {
        width: 1200px;
        margin: 0 auto;
    }
    #header {
        width: 100%;
        display: flex;
    }
    #header .logo {
        width: 20%;
        height: 100px;
        background-color: #efefef;
    }
    #header .nav {
        width: 80%;
        height: 100px;
        background-color: #e3e3e3;
    }
    #slider {
        width: 100%;
        height: 300px;
        background-color: #d9d9d9;
    }
    #contents {
        width: 100%;
        display: flex;
    }
    #contents .content1 {
        width: 33.3333%;
        height: 200px;
        background-color: #d1d1d1;
    }
    #contents .content2 {
        width: 33.3333%;
        height: 200px;
        background-color: #c7c7c7;
    }
    #contents .content3 {
        width: 33.3333%;
        height: 200px;
        background-color: #bcbcbc;
    }
    #footer {
        width: 100%;
        display: flex;
    }
    #footer .footer1 {
        width: 20%;
        height: 100px;
        background-color: #b1b1b1;
    }
    #footer .footer2 {
        width: 60%;
        height: 100px;
        background-color: #a3a3a3;
    }
    #footer .footer3 {
        width: 20%;
        height: 100px;
        background-color: #9d9d9d;
    }
    .tab-menu{
        padding: 20px;
    }
    .tab-menu .tab-btn ul{
        display: flex;
    }
    .tab-menu .tab-btn li{
        list-style: none;
    }
    .tab-menu .tab-btn li.active{
        text-decoration: underline;
    }
    .tab-menu .tab-btn li a{
        padding: 10px;
        display: block;
        background-color: #d3d1d1;
    }
    .tab-menu .tab-content > div{
        background-color: #c6c6c6;
        width: 300px;
        line-height: 1.4;
    }
    .tab-menu .tab-content > div:nth-child(2){
        display: none;
    }
    </style>
</head>
<body>
    <div id="wrap">
        <header id="header">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </header>
        <!-- //header -->
    
        <article id="slider">
        </article>
        <!-- //slider -->
    
        <main id="contents">
            <section class="content1">
                <div class="tab-menu">
                    <div class="tab-btn">
                        <ul>
                            <li class="active"><a href="#">탭메뉴1</a></li>
                            <li><a href="#">탭메뉴2</a></li>
                        </ul>
                    </div>
                    <div class="tab-content">
                        <div>탭메뉴1<br>탭메뉴1<br>탭메뉴1</div>
                        <div>탭메뉴2<br>탭메뉴2<br>탭메뉴2</div>
                    </div>
                </div>
            </section>
            <section class="content2"></section>
            <section class="content3"></section>
        </main>
        <!-- //contents -->
    
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </footer>
        <!-- //footer -->
    </div>
    <!-- //wrap -->

    <script>
       const tabBtn = document.querySelectorAll(".tab-btn > ul > li");
       const tabContent = document.querySelectorAll(".tab-content > div");

       tabContent.forEach(content => content.style.display = "none");
       tabContent[0].style.display = "block";

       tabBtn.forEach((btnItem, index) => {
            btnItem.addEventListener("click", () => {
                tabBtn.forEach(el => el.classList.remove("active"));
                btnItem.classList.add("active")

                tabContent.forEach(content => content.style.display = "none");
                tabContent[index].style.display = "block"
            })
       })

    </script>
</body>
</html>
