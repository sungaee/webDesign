<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인기능사 레이아웃 B-1</title>ㅣ
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
        }
        #header{
            width: 100%;
            background-color: #e0dddd;
        }
        #header .header_container {
            width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        #header .header_container .logo {
            height: 100px;
            width: 20%;
            background-color: #d2a9a9;
        }
        #header .header_container .nav {
            height: 100px;
            width: 80%;
            background-color: #746666;
        }
        #slider {
            width: 1200px;
            height: 300px;
            margin: 0 auto;
            background-color: #aaa3a3;
        }
        #contents {
            width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        #contents .content1 {
            width: 33.3333%;
            height: 200px;
            background-color: #636060;
        }
        #contents .content2 {
            width: 33.3333%;
            height: 200px;
            background-color: #393535;
        }
        #contents .content3 {
            width: 33.3333%;
            height: 200px;
            background-color: #3f3838;
        }
        #footer {
            width: 100%;
            background-color: #ffbebe;
        }
        #footer .footer_container{
            width: 1200px;
            display: flex;
            margin: 0 auto;
        }
        #footer .footer1{
            width: 20%;
            height: 100px;
            background-color: #c8c8c7;
        }
        #footer .footer2{
            width: 80%;
        }
        #footer .footer2 .footer2-1{
            height: 50px;
            background-color: #696b68;
        }
        #footer .footer2 .footer2-2{
            height: 50px;
            background-color: #7c8b75;
        }

    </style>

    <div id="wrap">
        <header id="header">
            <div class="header_container">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </div>
        </header>
           
        <article id="slider"></article>

        <main id="contents">
            <section class="content1"></section>
            <section class="content2"></section>
            <section class="content3"></section>
        </main>

        <footer id="footer">
            <div class="footer_container">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
            </div>
        </footer>
    </div>



</body>
</html>
