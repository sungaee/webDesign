<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-1</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    #wrap {
        width: 100%;

    }
    #main {
        width: 100%;
        height: calc(100vh - 120px); /* 반응형에서 많이 씀 */
        display: flex;
    }
    #header {
        width: 200px;
    }
    #header .logo{
        width: 100%;
        height: 10%;
        background-color: #bbcb99;
    }
    #header .nav{
        width: 100%;
        height: 90%;
        background-color: #636e4c;
    }
    #contents {
        width: 400px;
    }
    #contents .banner{
        width: 100%;
        height: 20%;
        background-color: #4e5a5a;

    }
    #contents .notice{
        width: 100%;
        height: 30%;
        background-color: #212c2c;

    }
    #contents .gallery{
        width: 100%;
        height: 30%;
        background-color: #3e6767;

    }
    #contents .link{
        width: 100%;
        height: 20%;
        background-color: #289999;

    }
    #slider {
        width: calc(100% - 600px);
        height: 100%;
        background-color: #4c4747;
    }
    #footer {
        width: 100%;
        display: flex;
    }
    #footer .footer1{
        width: 20%;
        height: 120px;
        background-color: #ae8d8d;
    }
    #footer .footer2{
        width: 80%;
    }
    #footer .footer2 .footer2-1{
        height: 60px;
        width: 100%;
        background-color: #3f2828;
    }
    #footer .footer2 .footer2-2{
        height: 60px;
        width: 100%;
        background-color: #675f5f;
    }
</style>
<body>
    <div id="wrap">
        <main id="main">
            <header id="header">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </header>
            <section id="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="link"></div>
            </section>
            <article id="slider"></article>
        </main>
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </footer>
    </div>


</body>
</html>
