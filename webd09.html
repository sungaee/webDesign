<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인기능사 레이아웃 C-1</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    #wrap {
        width: 1000px;
        display: flex;
    }
    #aside {
        width: 20%;
    }  
    #aside .logo{
        width: 100%;
        height: 100px;
        background-color: #efefef;
    }
    #aside .nav{
        width: 100%;
        height: 550px;
        background-color: #b4b5ac;
    }
    #main {
        width: 80%;
        height: 650px;
        background-color: #e3e3e3;
    }
    #slider{
        width: 100%;
        height: 350px;
        background-color: #563838;
    }
    #contents {
        width: 100%;
        display: flex;
    }
    #contents .content1{
        height: 200px;
        width: 33.3333%;
        background-color: #6060ec;
    }
    #contents .content2{
        height: 200px;
        width: 33.3333%;
        background-color: #9393e0;
    }
    #contents .content3{
        height: 200px;
        width: 33.3333%;
        background-color: #bebee2;
    }
    #footer {
        width: 100%;
        display: flex;
    }
    #footer .footer1{
        width: 20%;
        height: 100px;
        background-color: #747472;
    }
    #footer .footer2{
        width: 80%;
    }
    #footer .footer2-1{
        width: 100%;
        height: 50px;
        background-color: #758a26;

    }
    #footer .footer2-2{
        width: 100%;
        height: 50px;
        background-color: #f1fad1;
    }
</style>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>

        <main id="main">
            <article id="slider"></article>

            <section id="contents">
                <section class="content1"></section>
                <section class="content2"></section>
                <section class="content3"></section>
            </section>
            <footer id="footer">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
