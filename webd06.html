<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인기능사 레이아웃 B-2</title>
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
        }
        #header {
           width: 100%;
           background-color: #3fae45;
        }
        #header .header_container {
            width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        #header .header_container .logo{
            width: 20%;
            height: 100px;
            background-color: #323232;
        }
        #header .header_container .nav{
            width: 80%;
            height: 100px;
            background-color: #7b6d6d;
        }
        #slider {
            width: 1200px;
            height: 300px;
            margin: 0 auto;
            background-color: #858282;
        }
        #contents {
            width: 1200px;
            display: flex;
            margin: 0 auto;
        }
        #contents .content1{
            width: 33.3333%;
            height: 200px;
            background-color: #adacac;
        }
        #contents .content2{
            width: 33.3333%;
            height: 200px;
            background-color: #4c4040;
        }
        #contents .content3{
            width: 33.3333%;
            height: 200px;
            background-color: #adacac;
        }
        #footer {
            width: 100%;
            background-color: #113796;
        }
        #footer .footer_container{
            width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        #footer .footer_container .footer1{
            height: 100px;
            width: 80%;
            background-color: #bf6868;
        }
        #footer .footer_container .footer2{
            width: 20%;
        }
        #footer .footer_container .footer2 .footer2-1{
            height: 50px;
            background-color: #563939;

        }
        #footer .footer_container .footer2 .footer2-2{
            height: 50px;
            background-color: #a25757;
        }
    </style>

    <div id="wrap">
        <header id="header">
            <div class="header_container">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </div>
        </header>
        <article id="slider"></article>

        <main id="contents">
            <section class="content1"></section>
            <section class="content2"></section>
            <section class="content3"></section>
        </main>

        <footer id="footer">
            <div class="footer_container">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
            </div>
        </footer>

    </div>
</body>
</html>
