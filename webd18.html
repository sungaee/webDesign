<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-6</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    li {
        list-style: none;
    }
    a {
        text-decoration: none;
        color: #000;
    }
    #wrap {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    #aside {
        width: 200px;
    }
    #aside .logo{
        width: 100%;
        height: 100px;
        background-color: #d2ffe8;
    }
    #aside .nav{
        width: 100%;
        height: 700px;
        background-color: #989898;
    }

    #main {
        width: calc(100% - 200px);
    }
    .contents {
        display: flex;
        width: 100%;
    }
    .contents .slider{
        width: 80%;
        height: 500px;
        background-color: #b8b7b7;
    }
    .contents .banner{
        width: 20%;
        height: 500px;
        background-color: #a9a9a9;
    }
    #main .notice {
        width: 100%;
        height: 300px;
        background-color: #3e6579;
    }
    #footer {
        display: flex;
        width: 100%;
    }
    #footer .logo{
        width: 10%;
        height: 100px;
        background-color: #89d8ff;
    }
    #footer .copyright{
        width: 70%;
        height: 100px;
        background-color: #bde9ff;
    }
    #footer .site{
        width: 20%;
        height: 100px;
        background-color: #949da1;
    }
    /* nav */
    .nav {
        position: relative;
        z-index: 10000;
    }
    .nav > ul > li {
        position: relative;
    }
    .nav > ul > li > a {
        display: block;
        padding: 10px;
        text-align: center;
        background-color: #ebecff;
    }
    .nav > ul > li > a:hover{
        background-color: #bdc0ff;
    }
    .nav > ul > li > ul {
        position: absolute;
        top: 0;
        right: -500px;
        width: 500px;
        display: none;
    }
    .nav > ul > li > ul > li {
       display: inline;
    }
    .nav > ul > li > ul > li > a {
        display: inline-block;
        padding: 10px;
        width: 100px;
    }
    .nav > ul > li > ul > li > a:hover{
        background-color: #cbf6df;
    }
    #main {
        position: relative;
    }
    #main::after {
        content: '';
        width: 0;
        height: 200px;
        background-color: #ebecff;
        position: absolute;
        left: 0;
        top: 100px;
        z-index: 1;
        transition: all 300ms;
    }
    #main.on::after {
        width: 100%;
    }
</style>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav">
                <ul>
                    <li>
                        <a href="#">메뉴1</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴1-1</a></li>
                            <li><a href="#">서브메뉴1-2</a></li>
                            <li><a href="#">서브메뉴1-3</a></li>
                            <li><a href="#">서브메뉴1-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴2</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴2-1</a></li>
                            <li><a href="#">서브메뉴2-2</a></li>
                            <li><a href="#">서브메뉴2-3</a></li>
                            <li><a href="#">서브메뉴2-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴3</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴3-1</a></li>
                            <li><a href="#">서브메뉴3-2</a></li>
                            <li><a href="#">서브메뉴3-3</a></li>
                            <li><a href="#">서브메뉴3-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴4</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴4-1</a></li>
                            <li><a href="#">서브메뉴4-2</a></li>
                            <li><a href="#">서브메뉴4-3</a></li>
                            <li><a href="#">서브메뉴4-4</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>
        <div id="main">
            <div class="contents">
                <section class="slider"></section>
                <section class="banner"></section>
            </div>
            <div class="notice"></div>
        </div>
        <div id="footer">
            <div class="logo"></div>
            <div class="copyright"></div>
            <div class="site"></div>
        </div>
    </div>
</body>
<script>
    window.onload = function() {
        let navList = document.querySelector(".nav > ul");
        navList.addEventListener("mouseover", function() {
            navList.querySelectorAll(".submenu").forEach(sub => {
                sub.style.display = "block";
            })
            document.getElementById("main").classList.add("on");
        })
        navList.addEventListener("mouseout", function() {
            navList.querySelectorAll(".submenu").forEach(sub => {
                sub.style.display = "none";
            })
            document.getElementById("main").classList.remove("on");
        })
    }
</script>
</html>
