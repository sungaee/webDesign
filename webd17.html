<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-5</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    li {
        list-style: none;
    }
    a {
        text-decoration: none;
        color: #000;
    }
    #wrap {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    #aside {
        width: 200px;
    }
    #aside .logo{
        width: 100%;
        height: 100px;
        background-color: #9b9999;
    }
    #aside .nav {
        width: 100%;
        height: 700px;
        background-color: #c6c4c4;
    }
    #main {
        width: calc(100% - 200px);
    }
    #contents {
        width: 100%;
        display: flex;
    }
    #contents .slider {
        width: 80%;
        height: 500px;
        background-color: #dadada;
    }
    #contents .banner {
        width: 20%;
        height: 500px;
        background-color: #989898;
    }
    #main .notice {
        width: 100%;
        height: 300px;
        background-color: #ededed;

    }
    #footer {
        display: flex;
        width: 100%;
    }
    #footer .logo {
        width: 10%;
        height: 120px;
        background-color: #494949;
    }
    #footer .copyright {
        width: 60%;
        height: 120px;
        background-color: #747272;
    }
    #footer .site {
        width: 30%;
        height: 120px;
        background-color: #ccc7c7;
    }

    /* nav */
    .nav > ul > li {
        position: relative;
    }
    .nav > ul > li > a {
        display: block;
        padding: 10px;
        text-align: center;
        box-sizing: border-box;
        background-color: #c4c4c4;
    }
    .nav > ul > li > a:hover{
        background-color: #d8d6d6;
    }
    .nav > ul > li > ul {
        position: absolute;
        top: 0;
        right: -200px;
        width: 200px;
        background-color: #aeaeae;
        display: none;
    }
    .nav > ul > li > ul > li > a{
        padding: 10px;
        display: block;
    }
    .nav > ul > li > ul > li > a:hover{
        background-color: #fff;
    }

</style>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav">
                <ul>
                    <li>
                        <a href="#">메뉴1</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴1-1</a></li>
                            <li><a href="#">서브메뉴1-2</a></li>
                            <li><a href="#">서브메뉴1-3</a></li>
                            <li><a href="#">서브메뉴1-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴2</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴2-1</a></li>
                            <li><a href="#">서브메뉴2-2</a></li>
                            <li><a href="#">서브메뉴2-3</a></li>
                            <li><a href="#">서브메뉴2-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴3</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴3-1</a></li>
                            <li><a href="#">서브메뉴3-2</a></li>
                            <li><a href="#">서브메뉴3-3</a></li>
                            <li><a href="#">서브메뉴3-4</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#">메뉴4</a>
                        <ul class="submenu">
                            <li><a href="#">서브메뉴4-1</a></li>
                            <li><a href="#">서브메뉴4-2</a></li>
                            <li><a href="#">서브메뉴4-3</a></li>
                            <li><a href="#">서브메뉴4-4</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>

        <div id="main">
            <section id="contents">
                <div class="slider"></div>
                <div class="banner"></div>
            </section>
            <section class="notice"></section>
        </div>
        <div id="footer">
            <h1 class="logo"></h1>
            <div class="copyright"></div>
            <div class="site"></div>
        </div>
    </div>
</body>
<script>
   window.onload = function() {
    let navList = document.querySelectorAll(".nav > ul > li");

    navList.forEach(nav => {
        nav.querySelector("ul").style.display = "block";
        nav.querySelector("ul").style.height = "0";
        nav.querySelector("ul").style.overflow = "hidden";
        nav.querySelector("ul").style.transition = "all 400ms";
    })

    navList.forEach(navItem => {
        navItem.addEventListener("mouseover", function (){
            this.querySelector(".submenu").style.height = "155px";
        })
    })
    navList.forEach(navItem => {
        navItem.addEventListener("mouseout", function (){
            this.querySelector(".submenu").style.height = "0px";
        })
    })
   }

</script>
</html>
