<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-1</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }
    #wrap {
        width: 100%;
        display: flex;
        flex-wrap: wrap; /* 정렬 된 요소들의 총 넓이가 부모 넓이보다 클때, 이 요소들을 다음줄에 이어서 정렬 해주는 기능 */
    }
    #aside {
        width: 200px; /* 이부분은 고정 */
    }
    #aside .logo{
        background-color: #eafff4;
        height: 200px;
        width: 100%;
    }
    #aside .nav{
        background-color: #53b482;
        height: 650px;
        width: 100%;
    }
    #main {
        width: calc(100% - 200px); /* 이부분은 반응형 */
        height: 850px;
        background-color: #d3e8dd;

    }
    #slider{
        width: 100%;
        height: 400px;
        background-color: #c5d7ff;
        position: relative;
    }
    #slider .link{
        position: absolute;
        top: 0;
        right: 0;
        width: 100px;
        height: 300px;
        background-color: #a47070;
    }
    #banner{
        width: 100%;
        height: 200px;
        background-color: #96afe5;
    }
    #contents{
        width: 100%;
        height: 250px;
        background-color: #7896d6;
    }
    #footer {
        width: 100%;
        display: flex;
    }
    #footer .footer1{
        height: 100px;
        width: 10%;
        background-color: #7cd5d2;
    }
    #footer .footer2{
        height: 100px;
        width: 70%;
        background-color: #4b7b7a;
    }
    #footer .footer3{
        height: 100px;
        width: 20%;
        background-color: #315b5a;
    }
</style>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>

        <main id="main">
            <section id="slider">
                <div class="sliderWrap"></div>
                <div class="link"></div>
            </section>
            <section id="banner"></section>
            <section id="contents"></section>
        </main>

        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </footer>
    </div>
</body>
</html>
